<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Becas Nacionales | Iniciar sesión
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body class="login-body">


    <!-- ========================================= -->
    <!-- CONTENEDOR PRINCIPAL -->
    <!-- ========================================= -->

    <main class="login-layout">


        <!-- ========================================= -->
        <!-- LADO IZQUIERDO -->
        <!-- INFORMACIÓN DE LA PLATAFORMA -->
        <!-- ========================================= -->

        <section class="login-brand">

            <div class="brand-content">


                <div class="brand-icon">
                    B
                </div>


                <h1>
                    Becas Nacionales
                </h1>


                <p>
                    Plataforma Nacional para la Gestión
                    Integral de Becas.
                </p>


                <div class="brand-points">

                    <span>
                        ✓ Solicitudes digitales
                    </span>

                    <span>
                        ✓ Seguimiento por fases
                    </span>

                    <span>
                        ✓ Gestión administrativa
                    </span>

                </div>


            </div>

        </section>


        <!-- ========================================= -->
        <!-- LADO DERECHO -->
        <!-- INICIO DE SESIÓN -->
        <!-- ========================================= -->

        <section class="login-panel">


            <div class="login-card">


                <div class="login-header">


                    <span class="small-label">
                        PLATAFORMA DE BECAS
                    </span>


                    <h2>
                        Iniciar sesión
                    </h2>


                    <p>
                        Ingresa tus credenciales para continuar.
                    </p>


                </div>


                <!-- ================================= -->
                <!-- FORMULARIO LOGIN -->
                <!-- ================================= -->

                <form id="loginForm">


                    <div class="form-group">


                        <label for="usuario">
                            Usuario
                        </label>


                        <input
                            type="text"
                            id="usuario"
                            placeholder="Ingresa tu usuario"
                            autocomplete="username"
                            required
                        >


                    </div>


                    <div class="form-group">


                        <label for="password">
                            Contraseña
                        </label>


                        <input
                            type="password"
                            id="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >


                    </div>


                    <button
                        type="submit"
                        class="btn-primary btn-full"
                    >
                        Iniciar sesión
                    </button>


                    <p
                        id="loginMensaje"
                        class="form-message"
                    ></p>


                </form>


                <!-- ================================= -->
                <!-- REGISTRO -->
                <!-- ================================= -->

                <div class="login-divider">

                    <span>
                        ¿No tienes una cuenta?
                    </span>

                </div>


                <button
                    type="button"
                    class="btn-secondary btn-full"
                    onclick="abrirRegistro()"
                >
                    Crear cuenta de aspirante
                </button>


                <!-- ================================= -->
                <!-- USUARIOS DE PRUEBA -->
                <!-- ================================= -->


            </div>


        </section>


    </main>



    <!-- ============================================= -->
    <!-- MODAL PARA CREAR CUENTA -->
    <!-- ============================================= -->

    <div
        id="modalRegistro"
        class="modal"
    >


        <div class="modal-card">


            <!-- CERRAR MODAL -->

            <button
                type="button"
                class="modal-close"
                onclick="cerrarRegistro()"
            >
                ×
            </button>


            <h2>
                Crear cuenta
            </h2>


            <p>
                Registro de nuevo aspirante.
            </p>


            <!-- ================================= -->
            <!-- FORMULARIO DE REGISTRO -->
            <!-- ================================= -->

            <form id="registroForm">


                <div class="form-grid">


                    <!-- NOMBRE -->

                    <div class="form-group">


                        <label for="registroNombre">
                            Nombre completo
                        </label>


                        <input
                            id="registroNombre"
                            type="text"
                            placeholder="Ingresa tu nombre completo"
                            autocomplete="name"
                            required
                        >


                    </div>


                    <!-- DPI -->

                    <div class="form-group">


                        <label for="registroDpi">
                            DPI
                        </label>


                        <input
                            id="registroDpi" pattern="[0-9]{13}"
                            type="text"
                            maxlength="13"
                            minlength="13"
                            inputmode="numeric"
                            placeholder="13 dígitos"
                            required
                        >


                    </div>


                    <!-- CORREO -->

                    <div class="form-group">


                        <label for="registroCorreo">
                            Correo electrónico
                        </label>


                        <input
                            id="registroCorreo"
                            type="email"
                            placeholder="correo@ejemplo.com"
                            autocomplete="email"
                            required
                        >


                    </div>


                    <!-- USUARIO -->

                    <div class="form-group">


                        <label for="registroUsuario">
                            Usuario
                        </label>


                        <input
                            id="registroUsuario"
                            type="text"
                            placeholder="Crea un usuario"
                            autocomplete="username"
                            required
                        >


                    </div>


                    <!-- CONTRASEÑA -->

                    <div class="form-group full">


                        <label for="registroPassword">
                            Contraseña
                        </label>


                        <input
                            id="registroPassword" minlength="8"
                            type="password"
                            placeholder="Crea una contraseña"
                            autocomplete="new-password"
                            required
                        >


                    </div>


                </div>


                <!-- BOTÓN REGISTRAR -->

                <button
                    type="submit"
                    class="btn-primary btn-full"
                >
                    Registrar aspirante
                </button>


                <!-- MENSAJE -->

                <p
                    id="registroMensaje"
                    class="form-message"
                ></p>


            </form>


        </div>


    </div>



    <!-- ============================================= -->
    <!-- ARCHIVOS JAVASCRIPT -->
    <!-- IMPORTANTE: MANTENER ESTE ORDEN -->
    <!-- ============================================= -->

    <script src="./js/data/datos.js"></script>

    <script src="./js/app.js"></script>


</body>

</html>
