<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Becas Nacionales | Panel
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <meta name="theme-color" content="#123e39">
    <link rel="stylesheet" href="./css/mejoras.css">
</head>


<body id="dashboardPage" class="dashboard-body">
<a class="skip-link" href="#mainContent">Ir al contenido</a>
<button id="menuBackdrop" class="menu-backdrop" aria-label="Cerrar menú" hidden></button>


    <div class="dashboard-layout">


        <!-- ========================================= -->
        <!-- MENÚ LATERAL -->
        <!-- ========================================= -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <!--
                El menú se genera automáticamente
                dependiendo del rol del usuario.
            -->

        </aside>


        <!-- ========================================= -->
        <!-- CONTENIDO PRINCIPAL -->
        <!-- ========================================= -->

        <div class="dashboard-main">


            <!-- ========================================= -->
            <!-- BARRA SUPERIOR -->
            <!-- ========================================= -->

            <header class="topbar">


                <button id="menuToggle" class="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú"><svg class="ui-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
                <div class="topbar-title">

                    <span class="small-label">
                        Plataforma Nacional de Becas
                    </span>

                    <h2 id="pageTitle">
                        Panel
                    </h2>

                </div>


                <div
                    id="userBadge"
                    class="user-badge"
                >

                    <!-- Usuario generado por JS -->

                </div>


            </header>


            <!-- ========================================= -->
            <!-- CONTENIDO DINÁMICO -->
            <!-- ========================================= -->

            <main
                id="mainContent"
                class="dashboard-content" tabindex="-1"
            >

                <!--
                    Aquí aparecerán:
                    Inicio
                    Fase 1
                    Fase 2
                    Fase 3
                    Fase 4
                    Estado de beca
                    Mi cuenta
                -->

            </main>


        </div>


    </div>


    <!-- ============================================= -->
    <!-- LIBRERÍA PARA GENERAR PDF -->
    <!-- ============================================= -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    ></script>


    <!-- ============================================= -->
    <!-- ARCHIVOS DEL SISTEMA -->
    <!-- IMPORTANTE: DEBEN IR EN ESTE ORDEN -->
    <!-- ============================================= -->

    <script src="./js/iconos.js"></script>
    <script src="./js/formularioPdf.js"></script>
    <script src="./js/data/datos.js"></script>

    <script src="./js/roles/aspirante.js"></script>

    <script src="./js/roles/admin.js"></script>

    <script src="./js/roles/superadmin.js"></script>

    <script src="./js/app.js"></script>
<script src="./js/archivos.js"></script>
<script src="./js/mejoras.js"></script>


</body>

</html>
